<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ward | Ekiti State Women of Influence
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="header-container">

        <a
            href="index.html"
            class="logo-area"
        >

            <img
                src="logo.jpeg"
                alt="Logo"
                class="site-logo"
            >

            <div class="logo-text">

                <h1>
                    Ekiti State Women of Influence
                </h1>

                <p>
                    Ado Local Government
                </p>

            </div>

        </a>


        <button
            class="menu-btn"
            id="menuBtn"
            type="button"
        >
            ☰
        </button>


        <nav
            class="main-nav"
            id="navMenu"
        >

            <a href="index.html">
                Home
            </a>

            <a
                href="wards.html"
                class="active"
            >
                Wards
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="admin.html">
                Admin
            </a>

        </nav>

    </div>

</header>


<main class="section">

    <div class="container">

        <div class="content-card">

            <div class="section-title">

                <h2 id="wardTitle">
                    Ward
                </h2>

                <p id="wardDescription">
                    Accepted members in this ward.
                </p>

            </div>


            <div id="wardMembers">

                <div class="loading">
                    Loading members...
                </div>

            </div>


            <div style="text-align:center; margin-top:30px;">

                <a
                    href="wards.html"
                    class="btn secondary"
                >
                    ← Back to All Wards
                </a>

            </div>

        </div>

    </div>

</main>


<footer class="site-footer">

    <div class="container">

        <h3>
            Ekiti State Women of Influence
        </h3>

        <p>
            Ado Local Government
        </p>

        <p>
            Ado LGA Coordinator:
            08061254006
        </p>

    </div>

</footer>


<script src="script.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    loadWard
);


async function loadWard() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const ward =
        Number(
            params.get("ward")
        );


    const title =
        document.getElementById(
            "wardTitle"
        );


    const description =
        document.getElementById(
            "wardDescription"
        );


    const container =
        document.getElementById(
            "wardMembers"
        );


    if (
        !ward ||
        ward < 1 ||
        ward > 13
    ) {

        title.textContent =
            "Invalid Ward";

        description.textContent =
            "Please select a valid ward.";

        container.innerHTML =
            `
            <div class="empty-state">
                Invalid ward selected.
            </div>
            `;

        return;

    }


    title.textContent =
        `Ward ${ward}`;


    description.textContent =
        `Accepted members of Ward ${ward}.`;


    try {

        const members =
            await supabaseRequest(
                `members?status=eq.accepted&ward=eq.${ward}&select=full_name,phone,polling_booth,exco_position&order=full_name.asc`
            );


        if (
            !members ||
            members.length === 0
        ) {

            container.innerHTML =
                `
                <div class="empty-state">
                    No accepted members in Ward ${ward} yet.
                </div>
                `;

            return;

        }


        let html = `

            <div class="member-table-wrapper">

                <table class="member-table">

                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Polling Booth
                            </th>

                            <th>
                                EXCO
                            </th>

                        </tr>

                    </thead>

                    <tbody>
        `;


        members.forEach(
            member => {

                html += `

                    <tr>

                        <td>
                            ${escapeHTML(
                                member.full_name
                            )}
                        </td>

                        <td>
                            ${escapeHTML(
                                member.phone
                            )}
                        </td>

                        <td>
                            ${escapeHTML(
                                member.polling_booth
                            )}
                        </td>

                        <td>
                            ${escapeHTML(
                                member.exco_position ||
                                "—"
                            )}
                        </td>

                    </tr>

                `;

            }
        );


        html += `

                    </tbody>

                </table>

            </div>

        `;


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "WARD ERROR:",
            error
        );


        container.innerHTML =
            `
            <div class="empty-state error">

                Unable to load members.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>
            `;

    }

}

</script>


</body>

</html>
